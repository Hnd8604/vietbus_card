server.port=8080

# Su dung CSDL tap tin nhung H2 tu dong (khong can Docker):
spring.datasource.url=jdbc:h2:file:./data/buscard_db;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
